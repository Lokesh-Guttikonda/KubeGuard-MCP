apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-frontend
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-frontend
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: web
          image: acmeshop.azurecr.io/checkout-frontend:4.12.0
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
