apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels:
    app: orders-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders
        image: registry.acme.io/shop/orders-api:2.7.0
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://orders_svc:Wint3r-2025!@orders-db.shop.svc.cluster.local:5432/orders
        - name: AWS_ACCESS_KEY_ID
          value: AKIAIOSFODNN7EXAMPLE
        - name: AWS_SECRET_ACCESS_KEY
          value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        - name: S3_INVOICE_BUCKET
          value: acme-shop-invoices
        - name: LOG_LEVEL
          value: debug
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
